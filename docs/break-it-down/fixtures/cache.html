<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요청 시점의 캐시 판단</title>
<style>
  body { max-width: 38rem; margin: 3rem auto; padding: 0 1rem; font: 18px/1.6 system-ui, sans-serif; color: #172b35; }
  label { display: block; margin-top: 1rem; }
  input { font: inherit; width: 7rem; }
  output { display: block; margin: 1rem 0; font-weight: bold; }
  button { font: inherit; padding: .4rem 1rem; }
</style>
<main>
  <h1>요청 시점의 캐시 판단</h1>
  <p>저장된 결과가 아직 유효하면 같은 결과를 사용합니다.</p>
  <p id="explanation">TTL이 지나면 캐시는 자동으로 갱신됩니다.</p>
  <p>아래는 다음 요청이 도착한 순간을 계산하는 가상 모델입니다.</p>
  <form id="model">
    <label for="ttl">TTL (초)</label>
    <input id="ttl" name="ttl" type="number" min="1" max="3600" value="300" required>
    <label for="age">저장 후 경과 시간 (초)</label>
    <input id="age" name="age" type="number" min="0" max="7200" value="120" required>
    <output id="result" for="ttl age" aria-live="polite"></output>
    <button type="reset">초기화</button>
  </form>
</main>
<script>
  const model = document.getElementById('model');
  const ttl = document.getElementById('ttl');
  const age = document.getElementById('age');
  const result = document.getElementById('result');
  function update() {
    result.textContent = !model.checkValidity()
      ? '입력 범위를 확인해 주세요.'
      : age.valueAsNumber < ttl.valueAsNumber
        ? '저장된 결과를 사용합니다.'
        : '원본을 다시 조회합니다.';
  }
  model.addEventListener('input', update);
  model.addEventListener('reset', () => setTimeout(update, 0));
  model.addEventListener('submit', event => event.preventDefault());
  update();
</script>
</html>
